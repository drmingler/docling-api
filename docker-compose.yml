services:
  app:
    container_name: docling-api
    build:
      context: .
      args:
        CPU_ONLY: "true"
    image: docling-api:cpu
    command: uvicorn --port 8080 --host 0.0.0.0 main:app
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_HOST: redis://redis:6379/0
      ENV: production
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "2"
      PYTHONMALLOC: malloc
    ports:
      - "8080:8080"
    volumes:
      - model_cache:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: on-failure
    depends_on:
      - redis
      - celery_worker

  celery_worker:
    image: docling-api:cpu
    pull_policy: never
    command: celery -A worker.celery_config worker --pool=solo -n worker_primary --loglevel=info
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_HOST: redis://redis:6379/0
      ENV: production
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "2"
      PYTHONMALLOC: malloc
    volumes:
      - model_cache:/models
    restart: on-failure
    depends_on:
      - redis

  redis:
    container_name: docling-api-redis
    image: redis:7.2.4-alpine
    ports:
      - "6379:6379"
    restart: on-failure

  flower:
    container_name: docling-api-flower
    image: docling-api:cpu
    pull_policy: never
    command: celery -A worker.celery_config flower --port=5555
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_HOST: redis://redis:6379/0
      ENV: production
    ports:
      - "5556:5555"
    volumes:
      - model_cache:/models
    restart: on-failure
    depends_on:
      - redis
      - celery_worker

volumes:
  model_cache:
